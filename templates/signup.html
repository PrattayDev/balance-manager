<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Balance Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #eef0ea; --card: #ffffff; --ink: #1f2a38; --ink-soft: #5b6572;
            --hairline: #dfe2d6; --brick: #a6433c; --emerald: #2f7a56; --gold: #c69a3e;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif; margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 100% 0%, rgba(198,154,62,0.08) 0%, transparent 45%), var(--paper);
            color: var(--ink); padding: 20px;
        }
        .box {
            background: var(--card); padding: 40px 34px; border-radius: 12px;
            border: 1px solid var(--hairline); width: 100%; max-width: 380px;
            box-shadow: 0 20px 50px rgba(31,42,56,0.08);
            animation: fadeSlideUp 0.5s ease both;
        }
        .brand { text-align: center; margin-bottom: 26px; }
        .brand .mark { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-size: 26px; }
        .brand .tagline { display: block; font-size: 11px; color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
        h2 { margin: 0 0 18px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; text-align: center; }
        input, select, button {
            width: 100%; padding: 13px 14px; margin-top: 13px; border: 1.5px solid var(--hairline);
            border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease; background: var(--card); color: var(--ink);
        }
        input:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(31,42,56,0.08); }
        button {
            background-color: var(--emerald); color: white; border: none; cursor: pointer; font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        button:hover { background-color: #256045; transform: translateY(-1px); }
        .error { color: var(--brick); margin-top: 12px; font-weight: 600; font-size: 14px; text-align: center; }
        p.switch { margin-top: 22px; text-align: center; font-size: 14px; color: var(--ink-soft); }
        p.switch a { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 1.5px solid var(--gold); }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
</head>
<body>
    <div class="box">
        <div class="brand">
            <span class="mark">Balance Manager</span>
            <span class="tagline">Personal Ledger</span>
        </div>
        <h2>Create Account</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="/signup" method="POST">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Choose Password" required>
            <select name="currency" required>
                <option value="" disabled selected>Select Default Currency</option>
                <optgroup label="Popular">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="INR">INR (₹)</option>
                    <option value="BDT">BDT (৳)</option>
                </optgroup>
                <optgroup label="Asia">
                    <option value="JPY">JPY (¥)</option>
                    <option value="CNY">CNY (¥)</option>
                    <option value="PKR">PKR (₨)</option>
                    <option value="LKR">LKR (Rs)</option>
                    <option value="NPR">NPR (₨)</option>
                    <option value="SGD">SGD (S$)</option>
                    <option value="MYR">MYR (RM)</option>
                    <option value="THB">THB (฿)</option>
                    <option value="IDR">IDR (Rp)</option>
                    <option value="PHP">PHP (₱)</option>
                    <option value="VND">VND (₫)</option>
                    <option value="KRW">KRW (₩)</option>
                    <option value="HKD">HKD (HK$)</option>
                    <option value="TWD">TWD (NT$)</option>
                </optgroup>
                <optgroup label="Middle East">
                    <option value="AED">AED (د.إ)</option>
                    <option value="SAR">SAR (﷼)</option>
                    <option value="QAR">QAR (ر.ق)</option>
                    <option value="KWD">KWD (د.ك)</option>
                </optgroup>
                <optgroup label="Americas">
                    <option value="CAD">CAD (C$)</option>
                    <option value="BRL">BRL (R$)</option>
                    <option value="MXN">MXN (Mex$)</option>
                    <option value="ARS">ARS (AR$)</option>
                </optgroup>
                <optgroup label="Europe & Other">
                    <option value="CHF">CHF</option>
                    <option value="RUB">RUB (₽)</option>
                    <option value="TRY">TRY (₺)</option>
                    <option value="AUD">AUD (A$)</option>
                    <option value="NZD">NZD (NZ$)</option>
                    <option value="ZAR">ZAR (R)</option>
                    <option value="NGN">NGN (₦)</option>
                    <option value="KES">KES (KSh)</option>
                    <option value="EGP">EGP (E£)</option>
                </optgroup>
            </select>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch">Already have an account? <a href="/login">Log In</a></p>
    </div>
</body>
</html>
